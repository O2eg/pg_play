[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-play"
version = "0.6.0"
description = "MCP orchestrator for reproducible PostgreSQL performance experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "O2eg", email = "oleg.ispu@yandex.ru" },
]
keywords = ["postgresql", "orchestration", "diagnostics", "testing", "dba"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=1.28,<2",
  "pg-configurator>=0.11.1,<1",
  "pg-converter>=2.0b2,<3",
  "pg-diag>=0.19.1,<1",
  "pg-logical-repl>=0.2.0,<0.3",
  "pg-maker>=0.6.0,<1",
  "pg-perf-bench>=0.7.4,<1",
  "pg-stand>=0.3.0,<1",
  "pg-workload>=0.6.1,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "packaging>=24,<27",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.scripts]
pg-play = "pg_play.cli:main"
pg-play-mcp = "pg_play.mcp_server:main"

[project.urls]
Homepage = "https://o2eg.com/"
Repository = "https://github.com/O2eg/pg_play"
Issues = "https://github.com/O2eg/pg_play/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pg_play*"]
namespaces = false

[tool.setuptools.package-data]
pg_play = [
  "assets/*.py",
  "schema/*.json",
  "skills/*/SKILL.md",
  "skills/*/agents/*.yaml",
  "skills/*/references/*.md",
]

[tool.setuptools.data-files]
"share/doc/pg-play" = ["README.md", "CHANGELOG.md"]
"share/doc/pg-play/docs" = [
  "docs/agent-client-setup.md",
  "docs/pg_converter-integration.md",
  "docs/pg_logical_repl-integration.md",
  "docs/pg_maker-integration.md",
  "docs/user-scenarios.md",
]
"share/doc/pg-play/examples/logical" = ["examples/logical/scenario.yaml"]
"share/doc/pg-play/examples/maker" = ["examples/maker/my-feature-stand.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
