name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Check out pg_maker sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_maker
          path: .ci-components/pg_maker
      - name: Check out pg_logical_repl sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_logical_repl
          path: .ci-components/pg_logical_repl
      - name: Check out component sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_configurator
          path: .ci-components/pg_configurator
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_converter
          path: .ci-components/pg_converter
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_diag
          path: .ci-components/pg_diag
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_perf_bench
          path: .ci-components/pg_perf_bench
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_stand
          path: .ci-components/pg_stand
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_workload
          path: .ci-components/pg_workload
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pg_play and all component sources
        run: |
          python -m pip install \
            --editable .ci-components/pg_configurator \
            --editable .ci-components/pg_converter \
            --editable .ci-components/pg_diag \
            --editable .ci-components/pg_perf_bench \
            --editable .ci-components/pg_stand \
            --editable .ci-components/pg_workload \
            --editable .ci-components/pg_maker \
            --editable .ci-components/pg_logical_repl \
            --editable '.[dev]'
      - run: ruff check --exclude .ci-components .
      - run: ruff format --check --exclude .ci-components .
      - run: python -m pytest -q
      - run: python -m pip check

  distribution:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Check out pg_maker sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_maker
          path: .ci-components/pg_maker
      - name: Check out pg_logical_repl sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_logical_repl
          path: .ci-components/pg_logical_repl
      - name: Check out component sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_configurator
          path: .ci-components/pg_configurator
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_converter
          path: .ci-components/pg_converter
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_diag
          path: .ci-components/pg_diag
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_perf_bench
          path: .ci-components/pg_perf_bench
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_stand
          path: .ci-components/pg_stand
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: O2eg/pg_workload
          path: .ci-components/pg_workload
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Verify combined and standalone wheel installations
        shell: bash
        run: |
          wheelhouse="${RUNNER_TEMP}/pg-play-wheelhouse"
          verification="${GITHUB_WORKSPACE}/tests/check_installation.py"
          python -m pip wheel --wheel-dir "$wheelhouse" ./.ci-components/* dist/*.whl
          cd "${RUNNER_TEMP}"
          python -m venv pg-play-wheel-smoke
          pg-play-wheel-smoke/bin/python -m pip install --no-index --find-links "$wheelhouse" pg-play
          pg-play-wheel-smoke/bin/python -m pip check
          PATH="$PWD/pg-play-wheel-smoke/bin:$PATH" pg-play-wheel-smoke/bin/python "$verification"
          for component in pg-configurator pg-converter pg-diag pg-logical-repl pg-maker pg-perf-bench pg-stand pg-workload; do
            environment="${RUNNER_TEMP}/standalone-${component}"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install --no-index --find-links "$wheelhouse" "$component"
            "$environment/bin/python" -m pip check
            "$environment/bin/python" "$verification" --standalone "$component"
          done
